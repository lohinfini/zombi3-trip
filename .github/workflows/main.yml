
name: Project CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking project..."
          ls -la
          echo "Project check completed!"
