services:
  web:
    build: .
    container_name: zombi3-trip-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://zombi3:${POSTGRES_PASSWORD}@db:5432/zombi3_trip
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5433:5432"
    container_name: zombi3-trip-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: zombi3_trip
      POSTGRES_USER: zombi3
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - zombi3_trip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zombi3 -d zombi3_trip"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  zombi3_trip_pgdata:
